<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153c42"><title>Mosaic Pier · The Glasshouse</title><link rel="icon" href="assets/lagoon.png"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">✥</span> Mosaic Pier</div><div class="head-actions"><button id="sound" aria-pressed="false">Sound off</button><button id="guide">How to play</button></div></header>
<main>
<section class="art" aria-labelledby="place"><div class="artbase"></div><div id="color"></div><div class="artshade"></div><div class="frame"></div>
<div class="artcopy"><p class="eyebrow">THE RESTORATION JOURNAL</p><h1 id="place">The Pier <br>Glasshouse</h1><p id="story"></p><div class="steps" id="steps"></div><small id="progress"></small></div></section>
<section class="workshop" aria-labelledby="chapter"><div class="chapterline"><span class="line"></span><p class="eyebrow" id="chapterNo"></p><span class="line"></span></div><h2 id="chapter"></h2><div class="stats"><div><span id="moves">—</span><small>Moves left</small></div><div><span id="panes">—</span><small>Frosted panes</small></div><div><span id="score">—</span><small>Score</small></div></div>
<div class="boardwrap"><div id="board" role="group" aria-label="Stained glass board"></div></div>
<p id="message" aria-live="polite">Loading the glass workshop…</p><div class="tools"><button id="hint" disabled>✧ &nbsp; Show hint</button><button id="retry" disabled>↻ &nbsp; Restart level</button></div></section>
</main><dialog id="dialog"><div id="plate" hidden></div><div class="ornament" aria-hidden="true">✥</div><p class="eyebrow" id="modalTag"></p><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalAction"></button><button id="modalCancel" hidden>Keep playing</button></dialog>
<script type="module" src="game.js"></script></body></html>
