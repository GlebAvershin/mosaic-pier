name: Level workshop
on:
  workflow_dispatch:
  pull_request:
    paths: ["studio/**", "core/**", ".github/workflows/workshop.yml"]
permissions:
  contents: read
jobs:
  review:
    name: Review ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [mosaic, mosaic-layout]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GlebAvershin/lantern-atlas
          ref: a4c8bef02f7d9e035c4a23a116f9ad8e13eaa03b
          path: platform
      - uses: astral-sh/setup-uv@v6
      - name: Measure actual browser layout on the runner
        if: matrix.project == 'mosaic-layout'
        run: |
          python3 -m venv /tmp/pier-playwright
          /tmp/pier-playwright/bin/pip -q install playwright==1.58.0
          /tmp/pier-playwright/bin/playwright install --with-deps chromium
          python3 -m http.server 8754 --bind 127.0.0.1 -d web >/tmp/pier-layout-http.log 2>&1 &
          /tmp/pier-playwright/bin/python tools/layout-probe.py http://127.0.0.1:8754
          mkdir -p docs/evidence/cloud
          cp studio/layout-metrics.json docs/evidence/cloud/layout-metrics.json
      - run: studio/cluster.sh platform . "${{ matrix.project }}" docs/evidence/cloud
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-replays-${{ matrix.project }}
          path: docs/evidence/cloud
