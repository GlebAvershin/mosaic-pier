name: Responsive HUD handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - studio/hud-brief.json
      - studio/hud-evaluation.json
      - .github/workflows/hud-proof.yml
      - web/assets/kingfisher.jpg
      - web/index.html
  pull_request:
    paths:
      - studio/hud-brief.json
      - studio/hud-evaluation.json
      - .github/workflows/hud-proof.yml
      - web/assets/kingfisher.jpg
      - web/index.html
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: GlebAvershin/lantern-atlas/.github/actions/author-hud@ccd3c0badebff30f1757621698fa6d6bdbd327ca
